  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-950 text-sm font-semibold shadow-xl opacity-0 pointer-events-none transition-all duration-200 translate-y-2"></div>

  <script>
    (function () {
      const htmlEl = document.documentElement;
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const avatarImg = document.getElementById('avatarImg');
      const avatarFallback = document.getElementById('avatarFallback');
      const pokeBtn = document.getElementById('pokeBtn');
      const pokeCountEl = document.getElementById('pokeCount');
      const pokeReply = document.getElementById('pokeReply');
      const shareBtn = document.getElementById('shareBtn');
      const socialList = document.getElementById('socialList');
      const toast = document.getElementById('toast');
      const yearNow = document.getElementById('yearNow');

      yearNow.textContent = String(new Date().getFullYear());

      // Avatar fallback
      avatarImg.addEventListener('error', function () {
        avatarImg.classList.add('hidden');
        avatarFallback.classList.remove('hidden');
      });

      // Toast helper
      let toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.add('opacity-0', 'translate-y-2');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2200);
      }

      // Copy helper with fallback
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('已複製：' + text);
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('已複製：' + text);
        } catch (e) {
          showToast('複製失敗，請手動選取');
        }
        document.body.removeChild(ta);
      }

      // Theme persistence
      function applyTheme(isDark) {
        if (isDark) {
          htmlEl.classList.add('dark');
          themeIcon.textContent = '☀️';
        } else {
          htmlEl.classList.remove('dark');
          themeIcon.textContent = '🌙';
        }
      }

      let savedTheme = 'light';
      try {
        savedTheme = localStorage.getItem('firedog_theme_v2') || 'light';
      } catch (e) {}
      applyTheme(savedTheme === 'dark');

      themeToggle.addEventListener('click', function () {
        const nextDark = !htmlEl.classList.contains('dark');
        applyTheme(nextDark);
        try {
          localStorage.setItem('firedog_theme_v2', nextDark ? 'dark' : 'light');
        } catch (e) {}
      });

      // Poke interaction (Global shared counter via Abacus API + localStorage fallback)
      const POKE_API_BASE = 'https://abacus.jasoncameron.dev';
      const POKE_PATH = '/firedog0621/pokes';
      const pokeMessages = [
        '早安你好！收到你的戳戳了 :P',
        '汪！歡迎隨時來聊天或約打電動 🎮',
        '產圖進度條緩慢前進中……（但還是很開心你來逛）',
        '⚡ 傑拉奧拉超帥！你也這麼覺得對吧！',
        '都追都追 ψ(｀∇´)ψ 感謝戳友！'
      ];

      let pokeCount = 0;
      let localClicks = 0;
      try {
        pokeCount = parseInt(localStorage.getItem('firedog_pokes') || '0', 10) || 0;
      } catch (e) {}
      pokeCountEl.textContent = String(pokeCount);

      async function loadGlobalPokes() {
        try {
          const res = await fetch(POKE_API_BASE + '/get' + POKE_PATH);
          if (res.ok) {
            const data = await res.json();
            if (typeof data.value === 'number') {
              pokeCount = data.value;
              pokeCountEl.textContent = String(pokeCount);
              try { localStorage.setItem('firedog_pokes', String(pokeCount)); } catch (e) {}
            }
          } else if (res.status === 404) {
            pokeCount = 0;
            pokeCountEl.textContent = '0';
          }
        } catch (err) {
          pokeCountEl.textContent = String(pokeCount);
        }
      }
      loadGlobalPokes();

      pokeBtn.addEventListener('click', async function () {
        localClicks += 1;
        pokeCount += 1;
        pokeCountEl.textContent = String(pokeCount);
        pokeReply.textContent = pokeMessages[(localClicks - 1) % pokeMessages.length];
        pokeReply.classList.remove('hidden');
        pokeBtn.classList.remove('spark-pop');
        void pokeBtn.offsetWidth;
        pokeBtn.classList.add('spark-pop');

        try {
          localStorage.setItem('firedog_pokes', String(pokeCount));
        } catch (e) {}

        try {
          const res = await fetch(POKE_API_BASE + '/hit' + POKE_PATH);
          if (res.ok) {
            const data = await res.json();
            if (typeof data.value === 'number') {
              pokeCount = data.value;
              pokeCountEl.textContent = String(pokeCount);
              try { localStorage.setItem('firedog_pokes', String(pokeCount)); } catch (e) {}
            }
          }
        } catch (err) {
          // Keep optimistic local count if offline
        }
      });

      // Share button
      shareBtn.addEventListener('click', function () {
        const shareUrl = window.location.href && window.location.href.startsWith('http')
          ? window.location.href
          : 'https://linkgoods.com/firedog0621';
        copyText(shareUrl);
      });

      // Copy buttons in social list
      socialList.addEventListener('click', function (e) {
        const btn = e.target.closest('.copy-btn');
        if (!btn) return;
        const val = btn.getAttribute('data-copy');
        if (val) copyText(val);
      });

      // Photo Carousel (3s auto loop + swipe/drag + buttons + dots)
      const carousel = document.getElementById('carousel');
      const carouselTrack = document.getElementById('carouselTrack');
      const carouselPrev = document.getElementById('carouselPrev');
      const carouselNext = document.getElementById('carouselNext');
      const carouselDots = document.getElementById('carouselDots');
      const totalSlides = 5;
      let currentSlide = 0;
      let autoTimer = null;
      let isDragging = false;
      let startX = 0;
      let deltaX = 0;

      function updateCarousel(animate) {
        if (animate) {
          carouselTrack.classList.add('transition-transform', 'duration-500', 'ease-out');
        } else {
          carouselTrack.classList.remove('transition-transform', 'duration-500', 'ease-out');
        }
        carouselTrack.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
        carouselDots.querySelectorAll('.carousel-dot').forEach(function (dot, idx) {
          if (idx === currentSlide) {
            dot.classList.add('w-6', 'bg-volt-400');
            dot.classList.remove('w-2', 'bg-white/50');
          } else {
            dot.classList.remove('w-6', 'bg-volt-400');
            dot.classList.add('w-2', 'bg-white/50');
          }
        });
      }

      function goToSlide(idx) {
        currentSlide = (idx + totalSlides) % totalSlides;
        updateCarousel(true);
      }

      function startAutoPlay() {
        stopAutoPlay();
        autoTimer = setInterval(function () {
          goToSlide(currentSlide + 1);
        }, 3000);
      }

      function stopAutoPlay() {
        if (autoTimer !== null) {
          clearInterval(autoTimer);
          autoTimer = null;
        }
      }

      carouselPrev.addEventListener('click', function () {
        goToSlide(currentSlide - 1);
        startAutoPlay();
      });

      carouselNext.addEventListener('click', function () {
        goToSlide(currentSlide + 1);
        startAutoPlay();
      });

      carouselDots.addEventListener('click', function (e) {
        const dot = e.target.closest('.carousel-dot');
        if (!dot) return;
        const idx = parseInt(dot.getAttribute('data-slide'), 10);
        if (!isNaN(idx)) {
          goToSlide(idx);
          startAutoPlay();
        }
      });

      carousel.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button')) return;
        isDragging = true;
        startX = e.clientX;
        deltaX = 0;
        stopAutoPlay();
        carouselTrack.classList.remove('transition-transform', 'duration-500', 'ease-out');
        if (carousel.setPointerCapture) {
          try { carousel.setPointerCapture(e.pointerId); } catch (err) {}
        }
      });

      carousel.addEventListener('pointermove', function (e) {
        if (!isDragging) return;
        deltaX = e.clientX - startX;
        const width = carousel.clientWidth || 1;
        const offsetPct = (deltaX / width) * 100;
        carouselTrack.style.transform = 'translateX(' + (-currentSlide * 100 + offsetPct) + '%)';
      });

      function finishDrag() {
        if (!isDragging) return;
        isDragging = false;
        const threshold = (carousel.clientWidth || 300) * 0.15;
        if (deltaX < -threshold) {
          goToSlide(currentSlide + 1);
        } else if (deltaX > threshold) {
          goToSlide(currentSlide - 1);
        } else {
          updateCarousel(true);
        }
        startAutoPlay();
      }

      carousel.addEventListener('pointerup', finishDrag);
      carousel.addEventListener('pointercancel', finishDrag);

      updateCarousel(false);
      startAutoPlay();
    })();
  </script>
</body>
</html>
